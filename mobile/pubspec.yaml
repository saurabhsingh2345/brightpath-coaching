name: brightpath_coaching
description: BrightPath Coaching - one app for admins and students.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # networking
  dio: ^5.7.0

  # state
  provider: ^6.1.2

  # storage
  shared_preferences: ^2.3.3

  # realtime chat
  socket_io_client: ^2.0.3+1

  # utilities
  intl: ^0.19.0
  file_picker: ^8.1.6
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
