name: Build & release APK

# Push a tag (v1.0.0, v1.0.1, …) and this builds the Android app and attaches
# it to a GitHub Release. Share that Release link with the institute.
# Can also be run by hand from the Actions tab.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'Backend URL the app should talk to'
        required: false
        default: 'https://brightpath-coaching.vercel.app/api'

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Resolve API base URL
        id: cfg
        run: |
          URL="${{ github.event.inputs.api_base_url }}"
          if [ -z "$URL" ]; then
            URL="${{ vars.API_BASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://brightpath-coaching.vercel.app/api"
          fi
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Building against $URL"

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze
        working-directory: mobile
        run: flutter analyze --no-fatal-infos

      - name: Test
        working-directory: mobile
        run: flutter test

      - name: Build release APK
        working-directory: mobile
        run: |
          flutter build apk --release \
            --dart-define=API_BASE_URL=${{ steps.cfg.outputs.url }}
          flutter build apk --release --split-per-abi \
            --dart-define=API_BASE_URL=${{ steps.cfg.outputs.url }}

      - name: Name the artifacts
        working-directory: mobile/build/app/outputs/flutter-apk
        run: |
          cp app-release.apk BrightPath-Coaching.apk
          cp app-arm64-v8a-release.apk BrightPath-Coaching-arm64.apk
          ls -lh *.apk

      - uses: actions/upload-artifact@v4
        with:
          name: brightpath-apk
          path: mobile/build/app/outputs/flutter-apk/BrightPath-Coaching*.apk
          retention-days: 90

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: BrightPath Coaching ${{ github.ref_name }}
          files: |
            mobile/build/app/outputs/flutter-apk/BrightPath-Coaching.apk
            mobile/build/app/outputs/flutter-apk/BrightPath-Coaching-arm64.apk
          body: |
            ## Install on Android

            1. Download **BrightPath-Coaching.apk** below.
            2. Open it. Android will ask to allow installing from this source — allow it.
            3. Open **BrightPath** and log in.

            `BrightPath-Coaching-arm64.apk` is a smaller build for most modern
            phones; use the plain one if you are unsure.

            ## Or just open it in a browser

            <https://brightpath-coaching.vercel.app>

            ## Logins

            | | Email | Password |
            |---|---|---|
            | **Your admin** | `admin@gmail.com` | `password123` |
            | Demo admin | `admin@brightpath.edu` | `Admin@123` |
            | Demo student | `aarav@brightpath.edu` | `Student@123` |

            The login screen has one-tap **Admin** / **Student** buttons for the
            demo accounts so you can see everything working with sample data.
            When you're ready for real records, sign in as your own admin and use
            **Me → Start fresh** to remove the sample data.
